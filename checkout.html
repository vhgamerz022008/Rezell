<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | Rezell</title>
    <meta name="theme-color" content="#6c3df4" />
    <meta name="description" content="Complete your Rezell order securely." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">Rezell</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="index.html#products">Products</a>
      </nav>
      <div class="header-actions">
        <a href="wishlist.html" class="icon-link">♡ <span id="wishlist-count">0</span></a>
        <button class="icon-link" onclick="toggleCart()">🛒 <span id="cart-count">0</span></button>
        <a href="login.html" class="login-chip" id="loginLink">Login</a>
        <span id="userInfo" class="user-chip"></span>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <div class="checkout-card">
      <div class="checkout-grid">
        <div>
          <h2>Shipping Details</h2>
          <form id="checkoutForm">
            <input placeholder="Full name" required />
            <input placeholder="Phone number" required />
            <input placeholder="Email address" required />
            <textarea rows="4" placeholder="Delivery address" required></textarea>
            <button class="action-btn" type="submit">Place Order</button>
          </form>
          <div id="orderSuccess"></div>
        </div>
        <div class="summary-box">
          <h3>Order Summary</h3>
          <div id="checkoutSummary"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="cartSidebar" class="cart-sidebar">
    <div class="cart-header">
      <h2>Shopping Cart</h2>
      <button onclick="toggleCart()" aria-label="Close cart">✖</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-footer">
      <h3>Total: ₹<span id="cartTotal">0</span></h3>
      <a href="checkout.html" class="checkout-btn">Checkout</a>
    </div>
  </div>

  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
