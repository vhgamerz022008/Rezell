<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Rezell</title>
    <meta name="theme-color" content="#6c3df4" />
    <meta name="description" content="Sign in to your Rezell account." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">Rezell</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="index.html#products">Products</a>
      </nav>
      <div class="header-actions">
        <a href="wishlist.html" class="icon-link">♡ <span id="wishlist-count">0</span></a>
        <button class="icon-link" onclick="toggleCart()">🛒 <span id="cart-count">0</span></button>
        <a href="login.html" class="login-chip" id="loginLink">Login</a>
        <span id="userInfo" class="user-chip"></span>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p>Sign in to continue shopping at Rezell.</p>
      <form id="loginForm">
        <input id="username" type="text" placeholder="Username" required />
        <input id="email" type="email" placeholder="Email address" required />
        <input id="password" type="password" placeholder="Password" required />
        <button class="action-btn" type="submit">Create account</button>
      </form>
    </div>
  </main>

  <div id="cartSidebar" class="cart-sidebar">
    <div class="cart-header">
      <h2>Shopping Cart</h2>
      <button onclick="toggleCart()" aria-label="Close cart">✖</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-footer">
      <h3>Total: ₹<span id="cartTotal">0</span></h3>
      <a href="checkout.html" class="checkout-btn">Checkout</a>
    </div>
  </div>

  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
